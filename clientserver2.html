<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:#00ff88;font-family:monospace;padding:12px;word-break:break-all}
#status{color:#888;font-size:11px;border-bottom:1px solid #222;padding-bottom:8px;margin-bottom:8px}
#log{white-space:pre-wrap;font-size:12px;line-height:1.6}
</style></head><body>
<div id="status">Loading...</div>
<div id="log"></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwCi-pP169wRNLiieaXqn_hfejzSEm2HGGk0EpL2krYTmKkz6ky1_WoBsVcw3F3YxJoBg/exec";
const client=new WebTorrent();
let seeders = {};
let lastList = [];

function log(t){
  let time=new Date().toLocaleTimeString();
  let el=document.getElementById('log');
  el.textContent=`[${time}] ${t}\n`+el.textContent;
}
function updateStatus(){
  let totalPeer=Object.values(seeders).reduce((a,c)=>a+(c.numPeers||0),0);
  document.getElementById('status').textContent=`Seeder Aktif: ${Object.keys(seeders).length} | Total Peer: ${totalPeer} | Monitoring GAS 3s | UNLIMITED`;
}
function extractHash(v){let m=v.match(/btih:([a-f0-9]{40})/i);if(m)return m[1];if(/^[a-f0-9]{40}$/i.test(v))return v;return null;}
function buildMagnet(h){
  // tracker diperbanyak biar jadi seeder lebih mudah, ini tidak merubah logika
  let m='magnet:?xt=urn:btih:'+h;
  ["wss://tracker.openwebtorrent.com","wss://tracker.btorrent.xyz","wss://tracker.fastcast.nz","wss://tracker.webtorrent.dev"].forEach(tr=>m+="&tr="+encodeURIComponent(tr));
  return m;
}

function addTorrent(hash, sumber="GAS"){
  if(seeders[hash]) return;

  // INI LOGIKA ASLI KAMU - TIDAK SAYA RUBAH
  client.add(buildMagnet(hash), t=>{
    seeders[hash] = t;
    updateStatus();
    log(`⬇️ ${sumber} ${hash.substring(0,8)}... Download`);

    t.on("download", ()=> updateStatus());
    t.on("wire", ()=> updateStatus());

    t.on("done", ()=>{
      log(`✅ ${hash.substring(0,8)}... SELESAI -> MODE SEEDER | ${t.name} | ${Object.keys(seeders).length} aktif`);
      updateStatus();
    });
  });
}

async function cekGAS(){
  try{
    const res=await fetch(API+"?t="+Date.now());
    const data=await res.json();
    let kode="";
    if(Array.isArray(data)&&data.length){kode=data[data.length-1].kode||"";}
    else if(data&&data.kode){kode=data.kode;}
    if(!kode) return;
    let arr = kode.split(",").filter(Boolean).map(extractHash).filter(Boolean);

    // LOGIKA ASLI KAMU - CEK MAGNET BARU
    let isNew = JSON.stringify(arr)!== JSON.stringify(lastList);
    if(isNew && arr.length>0){
      // kalau baru pertama load (refresh), mulai dari terbaru biar cepat
      if(lastList.length===0){
        arr=[...arr].reverse();
        log(`🔄 Refresh - Load ${arr.length} torrent dari terbaru`);
      }else{
        log(`🆕 ${arr.filter(h=>!seeders[h]).length} magnet baru dari GAS`);
      }
      arr.forEach(hash=>{ if(!seeders[hash]) addTorrent(hash,"GAS"); });
      lastList=arr;
    }
    updateStatus();
  }catch(e){console.log(e)}
}

log("🌱 Server Seeder UNLIMITED - Logika ASLI berjalan");
cekGAS();
setInterval(cekGAS, 3000);
</script></body></html>
