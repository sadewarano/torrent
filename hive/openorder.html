<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIVE ENGINE - V6 OPEN ORDER 3</title>
<script src="https://unpkg.com/@hiveio/hive-js@latest/dist/hive.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0c;color:#e6e8ea;font-family:'Inter',sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:radial-gradient(700px at 50% -150px,#1a2a22 0%,transparent 60%),#080a0c;padding-bottom:20px}
.header{padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;background:rgba(8,10,12,.9);backdrop-filter:blur(10px)}
.card{background:linear-gradient(180deg,#1c2126 0%,#161a1e 100%);border:1px solid #23282e;border-radius:18px;padding:16px;margin:12px}
.card-market{border-color:#1e3a28}
label{display:block;font-size:10px;color:#7a7f85;font-weight:700;margin-top:12px;text-transform:uppercase}
input,select{width:100%;padding:14px;margin-top:6px;border-radius:12px;border:1px solid #2a2f35;background:#0d0f11;color:#fff;outline:none;font-family:'JetBrains Mono',monospace;font-size:13px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font-weight:800;cursor:pointer}.btn:disabled{opacity:.4}
.btn-g{background:#00ff88;color:#000}.btn-r{background:#ff3b4a;color:#fff}.btn-d{background:#242a30;color:#d0d4d8}
.btn-kc{background:linear-gradient(90deg,#00ff88,#00cc6a);color:#000}.btn-logout{background:#2a1a1e;color:#ff6b7a;border:1px solid #3a2025;padding:6px 12px;font-size:11px;width:auto;border-radius:20px}
.btn-tab{flex:1;padding:10px;font-size:11px;border-radius:10px;border:1px solid #2a2f35;background:#0d0f11;color:#7a7f85}.btn-tab.active-buy{background:#00ff88;color:#000;border-color:#00ff88}.btn-tab.active-sell{background:#ff3b4a;color:#fff;border-color:#ff3b4a}
.status{padding:12px;border-radius:12px;background:#0d0f11;border:1px solid #22272d;margin-top:10px;font-size:11px;white-space:pre-wrap;line-height:1.6;font-family:'JetBrains Mono',monospace}
.pill{background:#1e2429;border:1px solid #2a2f35;padding:6px 10px;border-radius:20px;font-size:11px;display:inline-block;margin:3px;font-family:'JetBrains Mono'}
.hidden{display:none!important}.success{color:#00ff88}.error{color:#ff6b6b}
.connected-bar{display:flex;justify-content:space-between;align-items:center;background:#0f1a14;border:1px solid #1e3a28;padding:12px 14px;border-radius:12px;margin-top:8px}
.order-row{display:grid;grid-template-columns:60px 1fr 1fr;gap:8px;padding:8px 10px;border-radius:10px;background:#0d0f11;border:1px solid #1e2429;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:11px;align-items:center}
.order-row.header{background:transparent;border:0;color:#7a7f85;font-size:10px;padding:4px 10px}
.order-row.sell{border-color:#3a1e22}.order-row.buy{border-color:#1e3a28}
.badge{font-size:10px;padding:4px 8px;border-radius:8px;background:#0d0f11;border:1px solid #2a2f35;color:#7a7f85}
.tabs{display:flex;gap:6px;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#161a1e;border:1px solid #2a2f35;border-radius:20px;padding:18px;width:100%;max-width:400px}
</style>
</head>
<body>
<div class="app">
<div class="header"><h3>OPEN ORDER • V6</h3><span id="kcDetect">CHECKING...</span></div>

<div class="card" id="loginCard">
<div id="connectedBar" class="connected-bar hidden"><div><b id="connectedUser">@-</b><div id="connectedMode" style="font-size:10px">-</div></div><button onclick="doLogout()" class="btn btn-logout">LOGOUT</button></div>
<div id="kcSection"><label>Keychain Login</label><input id="user" placeholder="masabqory"><button id="kcBtn" onclick="loginKC()" class="btn btn-kc" style="margin-top:10px">🔑 LOGIN KEYCHAIN</button><div id="kcStatus" class="status">Detecting...</div></div>
<div id="manualSection" class="hidden"><label>Manual Active Key</label><input id="userManual" placeholder="username"><input id="key" type="password" placeholder="5J... Active"><button id="loadBtn" class="btn btn-d" style="margin-top:10px">HUBUNGKAN</button></div>
<div id="info" class="status">Belum terhubung.</div>
</div>

<div class="card card-market hidden" id="tradeCard">
<div style="display:flex;justify-content:space-between;align-items:center"><label style="margin:0">OPEN ORDER BOOK</label><span class="badge" id="pairBadge">-</span></div>
<select id="tokenSelect"></select>

<div id="sellBox">
<label style="color:#ff6b7a">TOP 3 SELL (ASK) - Paling Murah</label>
<div class="order-row header"><div>TYPE</div><div>PRICE HIVE</div><div>QTY</div></div>
<div id="sellOrders"></div>
</div>

<div id="buyBox" style="margin-top:12px">
<label style="color:#00ff88">TOP 3 BUY (BID) - Paling Mahal</label>
<div class="order-row header"><div>TYPE</div><div>PRICE HIVE</div><div>QTY</div></div>
<div id="buyOrders"></div>
</div>

<div id="pairInfo" class="status" style="margin-top:12px">-</div>

<div class="tabs"><button id="tabBuy" class="btn-tab active-buy" onclick="setMode('buy')">🟢 BUY LIMIT</button><button id="tabSell" class="btn-tab" onclick="setMode('sell')">🔴 SELL LIMIT</button></div>

<div id="boxBuy">
<label>Harga Buy (HIVE per token)</label><input id="buyPrice" type="number" step="any" placeholder="0.001">
<label>Jumlah Token yang mau dibeli</label><div style="display:flex;gap:8px"><input id="buyQty" type="number" step="any" style="flex:1"><button class="btn btn-d" style="width:80px" onclick="setMax('buy')">MAX</button></div>
<div id="buyCalc" class="status">-</div>
<button class="btn btn-g" style="margin-top:12px" onclick="placeBuy()">PASANG BUY ORDER</button>
</div>

<div id="boxSell" class="hidden">
<label>Harga Sell (HIVE per token)</label><input id="sellPrice" type="number" step="any" placeholder="0.001">
<label>Jumlah Token yang dijual</label><div style="display:flex;gap:8px"><input id="sellQty" type="number" step="any" style="flex:1"><button class="btn btn-d" style="width:80px" onclick="setMax('sell')">MAX</button></div>
<div id="sellCalc" class="status">-</div>
<button class="btn btn-r" style="margin-top:12px" onclick="placeSell()">PASANG SELL ORDER</button>
</div>

<div id="myOrders" class="status" style="margin-top:12px">My open orders: -</div>
<div id="tradeLog" class="status">Siap.</div>
<button class="btn btn-d" style="margin-top:8px" onclick="loadMarket()">↻ REFRESH BOOK</button>
</div>

<div class="card">
<div style="display:flex;gap:8px"><button class="btn btn-g" style="font-size:12px" onclick="openDepo()">⬇️ DEPO HIVE</button><button class="btn btn-d" style="font-size:12px;border-color:#ff3b4a;color:#ff8a94" onclick="openWd()">⬆️ WD SWAP.HIVE</button></div>
<div id="swapHiveBox" class="status" style="margin-top:8px">-</div>
<div id="bals" style="margin-top:12px"></div>
</div>
</div>

<div id="depoModal" class="modal-bg hidden"><div class="modal"><h4>DEPO HIVE</h4><div id="hiveNativeBal" class="status">-</div><input id="depoAmount" type="number" step="0.001"><div id="depoLog" class="status">Siap.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="btn btn-d" onclick="closeDepo()">BATAL</button><button id="depoBtn" class="btn btn-g" onclick="doDepo()">DEPOSIT</button></div></div></div>
<div id="wdModal" class="modal-bg hidden"><div class="modal"><h4>WD SWAP.HIVE</h4><div id="swapHiveBalWd" class="status">-</div><input id="wdAmount" type="number" step="0.001"><div id="wdLog" class="status">Siap.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="btn btn-d" onclick="closeWd()">BATAL</button><button id="wdBtn" class="btn btn-r" onclick="doWd()">WITHDRAW</button></div></div></div>

<script>
const ENGINE_API="https://api.hive-engine.com/rpc/contracts";
hive.api.setOptions({url:"https://api.hive.blog"});
const $=id=>document.getElementById(id);
let account="", activeKey="", ownedMap={}, currentToken="", sellBook=[], buyBook=[], tokenPrec=8, useKeychain=false, nativeHiveBal=0, mySwapHive=0, mode="buy";

function forceLowercase(el){let v=el.value.toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9.-]/g,""); if(el.value!==v) el.value=v;}
["user","userManual"].forEach(id=>$(id).addEventListener("input",function(){forceLowercase(this);}));
function isKC(){return typeof window.hive_keychain!=='undefined' && window.hive_keychain!==null;}
function setDetect(t,ok){$("kcDetect").textContent=t; $("kcDetect").style.color=ok?"#00ff88":"#ff6b6b";}
function checkKC(){ if(isKC()){ $("kcSection").classList.remove("hidden"); $("manualSection").classList.add("hidden"); setDetect("KEYCHAIN OK",true);} else{ $("kcSection").classList.add("hidden"); $("manualSection").classList.remove("hidden"); setDetect("MANUAL MODE",false);} }
window.addEventListener('hive_keychain_ready',checkKC);
let tries=0; let iv=setInterval(()=>{tries++; if(isKC()){clearInterval(iv); checkKC();} if(tries>20){clearInterval(iv); checkKC();}},300);

async function rpc(m,p){let r=await fetch(ENGINE_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",method:m,params:p,id:1})}); let j=await r.json(); if(j.error) throw new Error(j.error.message); return j.result;}

async function loadBalances(){
 let balances=await rpc("find",{contract:"tokens",table:"balances",query:{account},limit:1000});
 ownedMap={}; balances.forEach(i=>ownedMap[i.symbol]=parseFloat(i.balance)||0);
 mySwapHive=ownedMap["SWAP.HIVE"]||0;
 $("swapHiveBox").textContent=`SWAP.HIVE: ${mySwapHive.toFixed(5)} | HIVE native: ${nativeHiveBal.toFixed(3)}`;
 $("bals").innerHTML=Object.entries(ownedMap).filter(([,b])=>b>0).sort((a,b)=>b[1]-a[1]).map(i=>`<span class="pill">${i[0]}: ${i[1]}</span>`).join("")||`<span class="pill">0</span>`;
 let html=""; Object.keys(ownedMap).filter(s=>s!=="SWAP.HIVE").sort((a,b)=>ownedMap[b]-ownedMap[a]).forEach(s=>{ html+=`<option value="${s}">★ ${s} — ${ownedMap[s]}</option>`; });
 html+=`<option disabled>────────</option><option value="ALIVE">ALIVE</option><option value="LEO">LEO</option><option value="BEE">BEE</option><option value="POB">POB</option><option value="VYB">VYB</option>`;
 $("tokenSelect").innerHTML=html;
 if(!currentToken) currentToken=Object.keys(ownedMap).filter(s=>s!=="SWAP.HIVE")[0]||"ALIVE";
 $("tokenSelect").value=currentToken;
}

async function loadNativeHive(){ return new Promise((res)=>{ hive.api.getAccounts([account],(err,accs)=>{ if(err||!accs||!accs[0]){ nativeHiveBal=0; res(0); return;} nativeHiveBal=parseFloat((accs[0].balance||"0 HIVE").split(" ")[0])||0; $("hiveNativeBal").textContent=`${nativeHiveBal.toFixed(3)} HIVE`; res(nativeHiveBal); }); }); }

async function loadMarket(){
 if(!currentToken) return;
 $("pairInfo").textContent="Loading book "+currentToken+"...";
 let [sell, buy, tokenInfo, myOrders] = await Promise.all([
  rpc("find",{contract:"market",table:"sellBook",query:{symbol:currentToken},limit:100,indexes:[{index:"priceDec",descending:false}]}),
  rpc("find",{contract:"market",table:"buyBook",query:{symbol:currentToken},limit:100,indexes:[{index:"priceDec",descending:true}]}),
  rpc("findOne",{contract:"tokens",table:"tokens",query:{symbol:currentToken}}),
  rpc("find",{contract:"market",table:"sellBook",query:{account, symbol:currentToken},limit:20}).catch(()=>[]).then(async sellMy=>{
    let buyMy=await rpc("find",{contract:"market",table:"buyBook",query:{account, symbol:currentToken},limit:20}).catch(()=>[]);
    return [...sellMy.map(o=>({...o, _type:'SELL'})), ...buyMy.map(o=>({...o, _type:'BUY'}))];
  })
 ]);
 sellBook=sell||[]; buyBook=buy||[]; tokenPrec=tokenInfo?.precision||8;
 $("pairBadge").textContent=currentToken+"/HIVE";

 // Render TOP 3 SELL
 let topSell=sellBook.slice(0,3);
 $("sellOrders").innerHTML=topSell.length? topSell.map((o,i)=>`<div class="order-row sell" onclick="usePrice('${o.price}','sell')"><div style="color:#ff6b7a">SELL ${i+1}</div><div>${parseFloat(o.price).toFixed(8)}</div><div>${parseFloat(o.quantity).toFixed(3)} <span style="color:#7a7f85">${o.account?.slice(0,6)||''}</span></div></div>`).join("") : `<div class="status">Tidak ada sell order</div>`;
 // Render TOP 3 BUY
 let topBuy=buyBook.slice(0,3);
 $("buyOrders").innerHTML=topBuy.length? topBuy.map((o,i)=>`<div class="order-row buy" onclick="usePrice('${o.price}','buy')"><div style="color:#00ff88">BUY ${i+1}</div><div>${parseFloat(o.price).toFixed(8)}</div><div>${parseFloat(o.quantity).toFixed(3)} <span style="color:#7a7f85">${o.account?.slice(0,6)||''}</span></div></div>`).join("") : `<div class="status">Tidak ada buy order</div>`;

 $("pairInfo").innerHTML=`<b>${currentToken}/SWAP.HIVE</b> | Best ASK: ${topSell[0]?.price||'-'} | Best BID: ${topBuy[0]?.price||'-'}<br>Spread: ${topSell[0]&&topBuy[0]? ((parseFloat(topSell[0].price)-parseFloat(topBuy[0].price))/parseFloat(topSell[0].price)*100).toFixed(2)+'%': '-'} | Kamu: ${ownedMap[currentToken]||0} ${currentToken} | ${mySwapHive.toFixed(3)} HIVE`;

 if(myOrders && myOrders.length){
   $("myOrders").innerHTML=`My open orders (${myOrders.length}):<br>`+myOrders.map(o=>`${o._type} ${o.quantity}@${o.price} <a href="#" onclick="cancelOrder('${o._id}','${o._type.toLowerCase()}')" style="color:#ff6b7a">[BATAL]</a>`).join("<br>");
 } else { $("myOrders").textContent="My open orders: tidak ada"; }

 calc();
}

function usePrice(price, type){
 if(type==='buy'){ $("buyPrice").value=price; setMode('buy'); }
 else { $("sellPrice").value=price; setMode('sell'); }
 calc();
}

function setMode(m){
 mode=m;
 $("tabBuy").className=m==="buy"?"btn-tab active-buy":"btn-tab";
 $("tabSell").className=m==="sell"?"btn-tab active-sell":"btn-tab";
 $("boxBuy").classList.toggle("hidden", m!=="buy");
 $("boxSell").classList.toggle("hidden", m!=="sell");
}

function setMax(type){
 if(type==='buy'){
   if(mySwapHive<=0){ $("tradeLog").textContent="SWAP.HIVE 0"; return; }
   let price=parseFloat($("buyPrice").value)||0;
   if(price<=0){ $("buyQty").value=0; $("tradeLog").textContent="Isi harga buy dulu"; return; }
   $("buyQty").value=(mySwapHive/price).toFixed(tokenPrec);
   calc();
 } else {
   $("sellQty").value=(ownedMap[currentToken]||0).toFixed(tokenPrec);
   calc();
 }
}

function calc(){
 let bp=parseFloat($("buyPrice").value)||0, bq=parseFloat($("buyQty").value)||0;
 let sp=parseFloat($("sellPrice").value)||0, sq=parseFloat($("sellQty").value)||0;
 if(bp>0&&bq>0){ $("buyCalc").textContent=`Total bayar: ${(bp*bq).toFixed(8)} SWAP.HIVE | Kamu punya: ${mySwapHive.toFixed(5)} ${bp*bq>mySwapHive?"❌ kurang":"✅ cukup"}`; }
 if(sp>0&&sq>0){ $("sellCalc").textContent=`Dapat: ${(sp*sq).toFixed(8)} SWAP.HIVE | Kamu punya: ${ownedMap[currentToken]||0} ${sq>(ownedMap[currentToken]||0)?"❌ kurang":"✅ cukup"}`; }
}

function broadcast(jsonPayload, onSuccess, onError){
 if(useKeychain && isKC()){
  window.hive_keychain.requestCustomJson(account, "ssc-mainnet-hive", "Active", jsonPayload, "Open Order "+currentToken, function(res){ if(res.success) onSuccess(res); else onError(new Error(res.message)); });
 }else{
  hive.broadcast.customJson(activeKey,[account],[],"ssc-mainnet-hive",jsonPayload,function(err,res){ if(err) onError(err); else onSuccess(res); });
 }
}

function placeBuy(){
 let price=parseFloat($("buyPrice").value)||0, qty=parseFloat($("buyQty").value)||0;
 if(!(price>0&&qty>0)){ $("tradeLog").textContent="Isi harga & jumlah buy"; return; }
 if(price*qty>mySwapHive){ $("tradeLog").textContent="HIVE kurang"; return; }
 let json=JSON.stringify({contractName:"market",contractAction:"buy",contractPayload:{symbol:currentToken,quantity:qty.toFixed(tokenPrec),price:price.toFixed(8)}});
 $("tradeLog").textContent=`Pasang BUY ${qty} ${currentToken} @ ${price}...`;
 broadcast(json, function(r){ let txid=r.result?.id||''; $("tradeLog").innerHTML=`<span class="success">✓ BUY ORDER OK</span> TX:${txid.slice(0,8)}`; setTimeout(loadMarket,2500); loadBalances(); }, function(e){ $("tradeLog").textContent="GAGAL BUY: "+e.message; });
}
function placeSell(){
 let price=parseFloat($("sellPrice").value)||0, qty=parseFloat($("sellQty").value)||0;
 if(!(price>0&&qty>0)){ $("tradeLog").textContent="Isi harga & jumlah sell"; return; }
 if(qty>(ownedMap[currentToken]||0)){ $("tradeLog").textContent="Token kurang"; return; }
 let json=JSON.stringify({contractName:"market",contractAction:"sell",contractPayload:{symbol:currentToken,quantity:qty.toFixed(tokenPrec),price:price.toFixed(8)}});
 $("tradeLog").textContent=`Pasang SELL ${qty} ${currentToken} @ ${price}...`;
 broadcast(json, function(r){ let txid=r.result?.id||''; $("tradeLog").innerHTML=`<span class="success">✓ SELL ORDER OK</span> TX:${txid.slice(0,8)}`; setTimeout(loadMarket,2500); loadBalances(); }, function(e){ $("tradeLog").textContent="GAGAL SELL: "+e.message; });
}
function cancelOrder(id, type){
 let action = type==='sell' ? "cancel" : "cancel"; // market uses same cancel? Actually market contractAction cancel for both? Check: market cancel with type buy/sell? Docs: action cancel with type?
 // Tribaldex uses market:cancel payload {type: 'buy'/'sell', id}
 let json=JSON.stringify({contractName:"market",contractAction:"cancel",contractPayload:{type:type, id:id}});
 $("tradeLog").textContent=`Batalkan ${type} ${id.slice(0,8)}...`;
 broadcast(json, function(r){ $("tradeLog").innerHTML=`<span class="success">✓ CANCEL OK</span>`; setTimeout(loadMarket,2000); }, function(e){ $("tradeLog").textContent="GAGAL CANCEL: "+e.message; });
}

function openDepo(){ $("depoModal").classList.remove("hidden"); loadNativeHive(); }
function closeDepo(){ $("depoModal").classList.add("hidden"); }
function openWd(){ $("wdModal").classList.remove("hidden"); $("swapHiveBalWd").textContent=`${mySwapHive.toFixed(5)} SWAP.HIVE`; }
function closeWd(){ $("wdModal").classList.add("hidden"); }
function doDepo(){
 let amt=parseFloat($("depoAmount").value)||0; if(amt<0.001){ $("depoLog").textContent="Min 0.001"; return; }
 $("depoBtn").disabled=true; let memo=JSON.stringify({id:"ssc-mainnet-hive",json:{contractName:"hivepegged",contractAction:"buy",contractPayload:{}}});
 let amountStr=amt.toFixed(3)+" HIVE";
 if(useKeychain && isKC()){ window.hive_keychain.requestTransfer(account, "honey-swap", amountStr, memo, "Active", function(res){ $("depoBtn").disabled=false; if(res.success){ $("depoLog").innerHTML=`<span class="success">✓ OK</span>`; setTimeout(()=>{loadNativeHive(); loadBalances();},3000);} else $("depoLog").textContent="GAGAL: "+res.message; }); }
 else { hive.broadcast.transfer(activeKey, account, "honey-swap", amountStr, memo, function(err,res){ $("depoBtn").disabled=false; if(err) $("depoLog").textContent="GAGAL: "+err.message; else $("depoLog").innerHTML=`<span class="success">✓ OK</span>`; }); }
}
function doWd(){
 let amt=parseFloat($("wdAmount").value)||0; if(amt<0.001){ $("wdLog").textContent="Min 0.001"; return; }
 $("wdBtn").disabled=true; let json=JSON.stringify({contractName:"hivepegged", contractAction:"withdraw", contractPayload:{quantity: amt.toFixed(3)}});
 function onOk(){ $("wdBtn").disabled=false; $("wdLog").innerHTML=`<span class="success">✓ WD OK</span>`; setTimeout(()=>{loadBalances(); loadNativeHive();},2500); }
 function onErr(e){ $("wdBtn").disabled=false; $("wdLog").textContent="GAGAL: "+e.message; }
 if(useKeychain && isKC()) window.hive_keychain.requestCustomJson(account, "ssc-mainnet-hive", "Active", json, "Withdraw", function(res){ if(res.success) onOk(); else onErr(new Error(res.message)); });
 else hive.broadcast.customJson(activeKey,[account],[],"ssc-mainnet-hive",json,function(err,res){ if(err) onErr(err); else onOk(); });
}

function loginKC(){
 let username=$("user").value.trim().toLowerCase().replace(/\s+/g,""); if(username.length<3){username=prompt("Username:"); if(!username) return; username=username.toLowerCase().replace(/\s+/g,"");}
 $("kcBtn").disabled=true; $("kcBtn").textContent="MENUNGGU...";
 window.hive_keychain.requestSignBuffer(username, "login-"+Date.now(), "Posting", async function(res){
  $("kcBtn").disabled=false; $("kcBtn").textContent="🔑 LOGIN KEYCHAIN";
  if(res.success){account=username.toLowerCase(); useKeychain=true; try{await loadNativeHive(); await loadBalances(); $("info").innerHTML=`<span class="success">● CONNECTED</span> @${account}`; $("tradeCard").classList.remove("hidden"); $("connectedBar").classList.remove("hidden"); $("connectedUser").textContent="@"+account; await loadMarket();}catch(e){$("info").textContent=e.message;}}else{$("kcStatus").textContent="GAGAL: "+res.message;}
 });
}
async function connectManual(){
 let u=($("userManual").value.trim()||$("user").value.trim()).toLowerCase().replace(/\s+/g,""); let k=$("key").value.trim();
 if(u.length<3){$("info").textContent="Username invalid"; return;} if(k.length<40){$("info").textContent="Key invalid"; return;}
 account=u; activeKey=k; useKeychain=false; try{await loadNativeHive(); await loadBalances(); $("info").innerHTML=`<span class="success">● CONNECTED</span> @${account}`; $("tradeCard").classList.remove("hidden"); await loadMarket();}catch(e){$("info").textContent=e.message;}
}
function doLogout(){ account=""; activeKey=""; useKeychain=false; $("tradeCard").classList.add("hidden"); $("connectedBar").classList.add("hidden"); $("info").textContent="Logged out."; }

$("loadBtn").onclick=connectManual;
$("tokenSelect").onchange=function(){ currentToken=this.value; loadMarket(); };
$("buyPrice").oninput=calc; $("buyQty").oninput=calc; $("sellPrice").oninput=calc; $("sellQty").oninput=calc;
window.addEventListener('load',()=>{ checkKC(); });
</script>
</body>
</html>
