<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIVE ENGINE - V6.3 STAKE FINAL</title>
<script src="https://unpkg.com/@hiveio/hive-js@latest/dist/hive.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0c;color:#e6e8ea;font-family:'Inter',sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:radial-gradient(700px at 50% -150px,#1a2a22 0%,transparent 60%),#080a0c;padding-bottom:20px}
.header{padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;background:rgba(8,10,12,.9);backdrop-filter:blur(10px)}
.card{background:linear-gradient(180deg,#1c2126 0%,#161a1e 100%);border:1px solid #23282e;border-radius:18px;padding:16px;margin:12px}
.card-transfer{border-color:#1e3a28}
label{display:block;font-size:10px;color:#7a7f85;font-weight:700;margin-top:12px;text-transform:uppercase}
input,select{width:100%;padding:14px;margin-top:6px;border-radius:12px;border:1px solid #2a2f35;background:#0d0f11;color:#fff;outline:none;font-family:'JetBrains Mono',monospace;font-size:13px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font-weight:800;cursor:pointer}.btn:disabled{opacity:.4}
.btn-g{background:#00ff88;color:#000}.btn-r{background:#ff3b4a;color:#fff}.btn-d{background:#242a30;color:#d0d4d8}.btn-y{background:#ffb700;color:#000}
.btn-kc{background:linear-gradient(90deg,#00ff88,#00cc6a);color:#000}.btn-logout{background:#2a1a1e;color:#ff6b7a;border:1px solid #3a2025;padding:6px 12px;font-size:11px;width:auto;border-radius:20px}
.btn-tab{flex:1;padding:10px;font-size:11px;border-radius:10px;border:1px solid #2a2f35;background:#0d0f11;color:#7a7f85}.btn-tab.active{background:#00ff88;color:#000;border-color:#00ff88}
.status{padding:12px;border-radius:12px;background:#0d0f11;border:1px solid #22272d;margin-top:10px;font-size:11px;white-space:pre-wrap;line-height:1.6;font-family:'JetBrains Mono',monospace}
.pill{background:#1e2429;border:1px solid #2a2f35;padding:6px 10px;border-radius:20px;font-size:11px;display:inline-block;margin:3px;font-family:'JetBrains Mono'}
.hidden{display:none!important}.success{color:#00ff88}.error{color:#ff6b6b}
.connected-bar{display:flex;justify-content:space-between;align-items:center;background:#0f1a14;border:1px solid #1e3a28;padding:12px 14px;border-radius:12px;margin-top:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#161a1e;border:1px solid #2a2f35;border-radius:20px;padding:18px;width:100%;max-width:420px}
.tabs{display:flex;gap:6px;margin-top:10px}
.stake-info{font-size:10px;color:#7a7f85;background:#0d0f11;border:1px solid #1e3a28;padding:8px 10px;border-radius:10px;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
<div class="header"><h3>HIVE ENGINE • V6.3 FINAL</h3><span id="kcDetect">CHECKING...</span></div>

<div class="card" id="loginCard">
<div id="connectedBar" class="connected-bar hidden"><div><b id="connectedUser">@-</b><div id="connectedMode" style="font-size:10px">-</div></div><button onclick="doLogout()" class="btn btn-logout">LOGOUT</button></div>
<div id="kcSection"><label>Keychain Login</label><input id="user" placeholder="masabqory"><button id="kcBtn" onclick="loginKC()" class="btn btn-kc" style="margin-top:10px">🔑 LOGIN KEYCHAIN</button><div id="kcStatus" class="status">Detecting...</div></div>
<div id="manualSection" class="hidden"><label>Manual (Wajib Active Key)</label><input id="userManual" placeholder="username"><input id="key" type="password" placeholder="5J... Active Key" style="margin-top:8px"><button id="loadBtn" class="btn btn-d" style="margin-top:10px">HUBUNGKAN</button></div>
<div id="info" class="status">Belum terhubung.</div>
</div>

<div class="card card-transfer hidden" id="transferCard">
<label>TOKEN ACTIONS</label><select id="tokenSelect"></select>
<div id="tokenDetail" class="stake-info">-</div>
<div id="pendingBox" class="stake-info hidden"></div>

<div class="tabs"><button id="tabTransfer" class="btn-tab active" onclick="setActionTab('transfer')">TRANSFER</button><button id="tabStake" class="btn-tab" onclick="setActionTab('stake')">STAKE</button><button id="tabUnstake" class="btn-tab" onclick="setActionTab('unstake')">UNSTAKE</button></div>
<div class="tabs"><button id="tabDelegate" class="btn-tab" onclick="setActionTab('delegate')">DELEGATE</button><button id="tabUndelegate" class="btn-tab" onclick="setActionTab('undelegate')">UNDELEGATE</button></div>

<div id="boxTransfer">
<label>Tujuan (lowercase)</label><input id="toUser" placeholder="bqory"><label>Jumlah</label><div style="display:flex;gap:8px"><input id="qty" type="number" step="any" style="flex:1"><button class="btn btn-d" style="width:80px" onclick="setMax('liquid')">MAX</button></div><label>Memo</label><input id="memo" placeholder="memo"><button class="btn btn-g" style="margin-top:12px" onclick="doTransfer()">TRANSFER</button>
</div>
<div id="boxStake" class="hidden"><label>Jumlah Stake</label><div style="display:flex;gap:8px"><input id="stakeQty" type="number" step="any" style="flex:1"><button class="btn btn-d" style="width:80px" onclick="setMax('stake')">MAX</button></div><label>Stake To (opsional, kosong = self)</label><input id="stakeTo" placeholder="kosong = kamu"><button id="stakeBtn" class="btn btn-g" style="margin-top:12px" onclick="doStake()">STAKE SEKARANG</button></div>
<div id="boxUnstake" class="hidden"><label>Jumlah Unstake</label><div style="display:flex;gap:8px"><input id="unstakeQty" type="number" step="any" style="flex:1"><button class="btn btn-d" style="width:80px" onclick="setMax('staked')">MAX</button></div><button id="unstakeBtn" class="btn btn-y" style="margin-top:12px" onclick="doUnstake()">UNSTAKE SEKARANG</button><button class="btn btn-d" style="margin-top:8px" onclick="loadPending()">CEK PENDING</button></div>
<div id="boxDelegate" class="hidden"><label>Delegate Ke</label><input id="delegateTo" placeholder="username"><label>Jumlah</label><div style="display:flex;gap:8px"><input id="delegateQty" type="number" step="any" style="flex:1"><button class="btn btn-d" style="width:80px" onclick="setMax('staked')">MAX</button></div><button class="btn btn-g" style="margin-top:12px" onclick="doDelegate()">DELEGATE</button></div>
<div id="boxUndelegate" class="hidden"><label>Jumlah Undelegate</label><div style="display:flex;gap:8px"><input id="undelegateQty" type="number" step="any" style="flex:1"><button class="btn btn-d" style="width:80px" onclick="setMax('delegated')">MAX</button></div><button class="btn btn-r" style="margin-top:12px" onclick="doUndelegate()">UNDELEGATE</button></div>

<div id="actionLog" class="status">Siap.</div>
</div>

<div class="card"><div style="display:flex;gap:8px"><button class="btn btn-g" style="font-size:12px" onclick="openDepo()">⬇️ DEPO HIVE</button><button class="btn btn-d" style="font-size:12px;border-color:#ff3b4a;color:#ff8a94" onclick="openWd()">⬆️ WD SWAP.HIVE</button></div><div id="swapHiveBox" class="stake-info">-</div><div id="bals" style="margin-top:12px"></div></div>
</div>

<div id="depoModal" class="modal-bg hidden"><div class="modal"><h4>DEPO HIVE → SWAP.HIVE</h4><div id="hiveNativeBal" class="status">-</div><input id="depoAmount" type="number" step="0.001"><div id="depoLog" class="status">Siap.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="btn btn-d" onclick="closeDepo()">BATAL</button><button id="depoBtn" class="btn btn-g" onclick="doDepo()">DEPOSIT</button></div></div></div>
<div id="wdModal" class="modal-bg hidden"><div class="modal"><h4>WD SWAP.HIVE → HIVE</h4><div id="swapHiveBalWd" class="status">-</div><input id="wdAmount" type="number" step="0.001"><div id="wdLog" class="status">Siap.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="btn btn-d" onclick="closeWd()">BATAL</button><button id="wdBtn" class="btn btn-r" onclick="doWd()">WITHDRAW</button></div></div></div>

<script>
const ENGINE_API="https://api.hive-engine.com/rpc/contracts";
hive.api.setOptions({url:"https://api.hive.blog"});
const $=id=>document.getElementById(id);
let account="", activeKey="", ownedMap={}, stakedMap={}, delegatedMap={}, currentToken="", mySwapHive=0, nativeHiveBal=0, useKeychain=false, tokenPrecision=8, tokenInfo=null;
const LS_CONN="he_v43_connected", LS_USER="he_v43_user", LS_MODE="he_v43_mode", LS_AKEY="he_v43_akey";

function forceHiveUsername(el){ let v=el.value.toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9.-]/g,""); if(el.value!==v) el.value=v; }
["user","userManual","toUser","stakeTo","delegateTo"].forEach(id=>{ $(id).addEventListener("input",function(){forceHiveUsername(this);}); });

function saveConnection(){localStorage.setItem(LS_CONN,"1"); localStorage.setItem(LS_USER,account); localStorage.setItem(LS_MODE,useKeychain?"keychain":"manual"); if(!useKeychain&&activeKey) localStorage.setItem(LS_AKEY,btoa(activeKey));}
function clearConnection(){localStorage.removeItem(LS_CONN); localStorage.removeItem(LS_USER); localStorage.removeItem(LS_MODE); localStorage.removeItem(LS_AKEY);}
function showConnectedUI(){$("kcSection").classList.add("hidden"); $("manualSection").classList.add("hidden"); $("connectedBar").classList.remove("hidden"); $("connectedUser").textContent="@"+account; $("connectedMode").textContent=useKeychain?"KEYCHAIN":"MANUAL"; $("info").innerHTML=`<span class="success">● CONNECTED</span> @${account}`; $("transferCard").classList.remove("hidden");}
function showDisconnectedUI(){$("connectedBar").classList.add("hidden"); $("transferCard").classList.add("hidden");}
function isKC(){return typeof window.hive_keychain!=='undefined' && window.hive_keychain!==null;}
function setDetect(t,ok){$("kcDetect").textContent=t; $("kcDetect").style.color=ok?"#00ff88":"#ff6b6b";}
function checkKC(){if(localStorage.getItem(LS_CONN)) return; if(isKC()){ $("kcSection").classList.remove("hidden"); $("manualSection").classList.add("hidden"); setDetect("KEYCHAIN OK",true);} else{ $("kcSection").classList.add("hidden"); $("manualSection").classList.remove("hidden"); setDetect("MANUAL MODE",false);} }
window.addEventListener('hive_keychain_ready',checkKC);
let tries=0; let iv=setInterval(()=>{tries++; if(isKC()){clearInterval(iv); checkKC();} if(tries>20){clearInterval(iv); checkKC();}},300);
async function rpc(m,p){let r=await fetch(ENGINE_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",method:m,params:p,id:1})}); let j=await r.json(); if(j.error) throw new Error(j.error.message); return j.result;}

async function loadBalances(){
 let balances=await rpc("find",{contract:"tokens",table:"balances",query:{account},limit:1000});
 ownedMap={}; stakedMap={}; delegatedMap={};
 balances.forEach(i=>{ ownedMap[i.symbol]=parseFloat(i.balance)||0; stakedMap[i.symbol]=parseFloat(i.stake)||0; delegatedMap[i.symbol]={out:parseFloat(i.delegationsOut||0), in:parseFloat(i.delegationsIn||0)}; });
 mySwapHive=ownedMap["SWAP.HIVE"]||0;
 $("bals").innerHTML=Object.entries(ownedMap).filter(([s,b])=>b>0|| (stakedMap[s]||0)>0).sort((a,b)=>b[1]-a[1]).map(i=>`<span class="pill">${i[0]}: ${i[1]} | S:${stakedMap[i[0]]||0}</span>`).join("")||`<span class="pill">0</span>`;
 let html=""; Object.entries(ownedMap).sort((a,b)=>b[1]-a[1]).forEach(([s,b])=>{ html+=`<option value="${s}">${s} — ${b} (S:${stakedMap[s]||0})</option>`; });
 if(!html) html=`<option value="SWAP.HIVE">SWAP.HIVE</option>`;
 let prev=currentToken; $("tokenSelect").innerHTML=html;
 if(prev && ownedMap[prev]!==undefined){ currentToken=prev; $("tokenSelect").value=prev; } else currentToken=$("tokenSelect").value;
 await loadTokenInfo();
}
async function loadTokenInfo(){
 if(!currentToken) return;
 try{
  let info=await rpc("findOne",{contract:"tokens",table:"tokens",query:{symbol:currentToken}});
  tokenInfo=info; tokenPrecision=info?.precision||8;
  let staking = info?.stakingEnabled? "✅ STAKE ON" : "❌ STAKE OFF";
  let unstakingCooldown = info?.unstakingCooldown? `cooldown ${(info.unstakingCooldown/86400).toFixed(0)}h` : "";
  let del = info?.delegationEnabled? "✅ DELEGATION ON" : "❌ DELEGATION OFF";
  $("tokenDetail").innerHTML=`<b>${currentToken}</b> prec:${tokenPrecision} | ${staking} ${unstakingCooldown}<br>${del}<br>Liquid:${ownedMap[currentToken]||0} | Staked:${stakedMap[currentToken]||0} | DelOut:${delegatedMap[currentToken]?.out||0}`;
  $("stakeBtn").disabled=!info?.stakingEnabled;
  $("unstakeBtn").disabled=!info?.stakingEnabled;
 }catch(e){ $("tokenDetail").textContent="Error: "+e.message; }
 $("swapHiveBox").textContent=`SWAP.HIVE: ${mySwapHive.toFixed(5)} | HIVE: ${nativeHiveBal.toFixed(3)} | ${currentToken} STAKED:${stakedMap[currentToken]||0}`;
}
async function loadNativeHive(){ return new Promise((res)=>{ hive.api.getAccounts([account],(err,accs)=>{ if(err||!accs||!accs[0]){ nativeHiveBal=0; res(0); return;} nativeHiveBal=parseFloat((accs[0].balance||"0 HIVE").split(" ")[0])||0; $("hiveNativeBal").textContent=`${nativeHiveBal.toFixed(3)} HIVE`; res(nativeHiveBal); }); }); }
async function loadPending(){
 try{
  let pending=await rpc("find",{contract:"tokens",table:"pendingUnstakes",query:{account,symbol:currentToken},limit:100});
  if(!pending || pending.length===0){ $("pendingBox").classList.remove("hidden"); $("pendingBox").textContent="Tidak ada pending unstake "+currentToken; return; }
  let html="Pending unstake:<br>"; pending.forEach(p=>{ let d=new Date(p.nextTransactionTimestamp*1000); html+=`${p.quantity} → ${d.toLocaleString()}<br>`; });
  $("pendingBox").classList.remove("hidden"); $("pendingBox").innerHTML=html;
 }catch(e){ $("pendingBox").classList.remove("hidden"); $("pendingBox").textContent="Error pending: "+e.message; }
}

function setActionTab(tab){
 ["Transfer","Stake","Unstake","Delegate","Undelegate"].forEach(t=>{
   $("tab"+t).classList.remove("active"); $("box"+t).classList.add("hidden");
 });
 $("tab"+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add("active");
 $("box"+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.remove("hidden");
}
function openDepo(){ $("depoModal").classList.remove("hidden"); loadNativeHive(); }
function closeDepo(){ $("depoModal").classList.add("hidden"); }
function openWd(){ $("wdModal").classList.remove("hidden"); $("swapHiveBalWd").textContent=`${mySwapHive.toFixed(5)} SWAP.HIVE`; }
function closeWd(){ $("wdModal").classList.add("hidden"); }
function setMax(type){
 if(type==='liquid') $("qty").value=ownedMap[currentToken]||0;
 if(type==='stake') $("stakeQty").value=ownedMap[currentToken]||0;
 if(type==='staked'){ $("unstakeQty").value=stakedMap[currentToken]||0; $("delegateQty").value=stakedMap[currentToken]||0; }
 if(type==='delegated') $("undelegateQty").value=delegatedMap[currentToken]?.out||0;
}
function fmt(qty){ return Number(qty).toFixed(tokenPrecision); }

function broadcast(jsonPayload, onSuccess, onError){
 if(useKeychain && isKC()){
  window.hive_keychain.requestCustomJson(account, "ssc-mainnet-hive", "Active", jsonPayload, "HE "+currentToken, function(res){ if(res.success) onSuccess(res); else onError(new Error(res.message)); });
 }else{
  hive.broadcast.customJson(activeKey,[account],[],"ssc-mainnet-hive",jsonPayload,function(err,res){ if(err) onError(err); else onSuccess(res); });
 }
}

async function pollAfter(oldLiq, oldStake){
 let tries=0;
 async function tick(){
  tries++; await loadBalances();
  let nLiq=ownedMap[currentToken]||0; let nStake=stakedMap[currentToken]||0;
  if(Math.abs(nLiq-oldLiq)>1e-9 || Math.abs(nStake-oldStake)>1e-9){
    $("actionLog").innerHTML+=`<br><span class="success">✓ CONFIRMED BLOCK ${tries}</span> Liq ${oldLiq}→${nLiq} Stake ${oldStake}→${nStake}`;
    return;
  }
  if(tries>=15){ $("actionLog").innerHTML+=`<br>⏳ Belum berubah, cek https://tribaldex.com/wallet`; return; }
  $("actionLog").textContent=`⏳ Menunggu block ${tries}/15...`;
  setTimeout(tick, 2500);
 }
 setTimeout(tick, 2500);
}

function doDepo(){
 let amt=parseFloat($("depoAmount").value)||0; if(amt<0.001){ $("depoLog").textContent="Minimal 0.001"; return; }
 $("depoBtn").disabled=true; let memo=JSON.stringify({id:"ssc-mainnet-hive",json:{contractName:"hivepegged",contractAction:"buy",contractPayload:{}}});
 let amountStr=amt.toFixed(3)+" HIVE"; $("depoLog").textContent=`Depo ${amountStr}...`;
 if(useKeychain && isKC()){
  window.hive_keychain.requestTransfer(account, "honey-swap", amountStr, memo, "Active", function(res){ $("depoBtn").disabled=false; if(res.success){ $("depoLog").innerHTML=`<span class="success">✓ OK</span>`; setTimeout(async()=>{ await loadNativeHive(); await loadBalances(); }, 3500);} else $("depoLog").textContent="GAGAL: "+res.message; });
 } else { hive.broadcast.transfer(activeKey, account, "honey-swap", amountStr, memo, function(err,res){ $("depoBtn").disabled=false; if(err) $("depoLog").textContent="GAGAL: "+err.message; else $("depoLog").innerHTML=`<span class="success">✓ OK</span>`; }); }
}
function doWd(){
 let amt=parseFloat($("wdAmount").value)||0; if(amt<0.001){ $("wdLog").textContent="Minimal 0.001"; return; }
 $("wdBtn").disabled=true; let json=JSON.stringify({contractName:"hivepegged", contractAction:"withdraw", contractPayload:{quantity: amt.toFixed(3)}});
 function onOk(r){ $("wdBtn").disabled=false; $("wdLog").innerHTML=`<span class="success">✓ WD OK</span>`; setTimeout(async()=>{ await loadBalances(); await loadNativeHive(); }, 2500); }
 function onErr(e){ $("wdBtn").disabled=false; $("wdLog").textContent="GAGAL: "+e.message; }
 if(useKeychain && isKC()) window.hive_keychain.requestCustomJson(account, "ssc-mainnet-hive", "Active", json, "Withdraw", function(res){ if(res.success) onOk(res); else onErr(new Error(res.message)); });
 else hive.broadcast.customJson(activeKey,[account],[],"ssc-mainnet-hive",json,function(err,res){ if(err) onErr(err); else onOk(res); });
}

async function doTransfer(){
 let sym=currentToken; let to=$("toUser").value.trim().toLowerCase(); let qty=parseFloat($("qty").value)||0; let memo=$("memo").value;
 if(!to||to.length<3){ $("actionLog").textContent="Username tujuan invalid"; return; }
 if(!(qty>0)){ $("actionLog").textContent="Jumlah invalid"; return; }
 let payload={symbol:sym,to:to,quantity:fmt(qty),memo:memo};
 let json=JSON.stringify({contractName:"tokens",contractAction:"transfer",contractPayload:payload});
 $("actionLog").textContent=`Transfer ${qty} ${sym} → @${to}...`;
 let oldLiq=ownedMap[currentToken]||0; let oldStake=stakedMap[currentToken]||0;
 broadcast(json, async function(r){ let txid=r.result?.id||''; $("actionLog").innerHTML=`<span class="success">✓ BROADCAST OK</span> TX:${txid.slice(0,8)}<br><a href="https://history.hive-engine.com/tx/${txid}" target="_blank" style="color:#00ff88">Lihat TX</a>`; pollAfter(oldLiq, oldStake); }, function(e){ $("actionLog").textContent=`GAGAL: ${e.message}`; });
}
async function doStake(){
 let sym=currentToken; let qty=parseFloat($("stakeQty").value)||0; let to=$("stakeTo").value.trim().toLowerCase();
 if(!(qty>0)){ $("actionLog").textContent="Jumlah stake invalid"; return; }
 if(!tokenInfo?.stakingEnabled){ $("actionLog").textContent=`${sym} staking OFF`; return; }
 let payload={symbol:sym,quantity:fmt(qty)};
 if(to) payload.to=to; // optional
 let json=JSON.stringify({contractName:"tokens",contractAction:"stake",contractPayload:payload});
 let oldLiq=ownedMap[currentToken]||0; let oldStake=stakedMap[currentToken]||0;
 $("actionLog").textContent=`Stake ${qty} ${sym} ${to?"to @"+to:""}...`;
 broadcast(json, async function(r){ let txid=r.result?.id||r.id||''; $("actionLog").innerHTML=`<span class="success">✓ STAKE BROADCAST OK</span> ${qty} ${sym} TX:${txid.slice(0,8)}<br><a href="https://history.hive-engine.com/tx/${txid}" target="_blank" style="color:#00ff88">Lihat TX</a><br>⏳ Tunggu block...`; pollAfter(oldLiq, oldStake); }, function(e){ $("actionLog").textContent=`GAGAL STAKE: ${e.message}\nJSON: ${json}`; });
}
async function doUnstake(){
 let sym=currentToken; let qty=parseFloat($("unstakeQty").value)||0;
 if(!(qty>0)){ $("actionLog").textContent="Jumlah unstake invalid"; return; }
 let oldLiq=ownedMap[currentToken]||0; let oldStake=stakedMap[currentToken]||0;
 let json=JSON.stringify({contractName:"tokens",contractAction:"unstake",contractPayload:{symbol:sym,quantity:fmt(qty)}});
 $("actionLog").textContent=`Unstake ${qty} ${sym}...`;
 broadcast(json, async function(r){ let txid=r.result?.id||''; $("actionLog").innerHTML=`<span class="success">✓ UNSTAKE BROADCAST OK</span> TX:${txid.slice(0,8)} cooldown ${tokenInfo?.unstakingCooldown||''}s`; pollAfter(oldLiq, oldStake); setTimeout(loadPending,3000); }, function(e){ $("actionLog").textContent=`GAGAL UNSTAKE: ${e.message}`; });
}
async function doDelegate(){
 let sym=currentToken; let to=$("delegateTo").value.trim().toLowerCase(); let qty=parseFloat($("delegateQty").value)||0;
 if(!to||to.length<3){ $("actionLog").textContent="Delegate ke siapa?"; return; }
 if(!(qty>0)){ $("actionLog").textContent="Jumlah invalid"; return; }
 let json=JSON.stringify({contractName:"tokens",contractAction:"delegate",contractPayload:{symbol:sym,to:to,quantity:fmt(qty)}});
 let oldLiq=ownedMap[currentToken]||0; let oldStake=stakedMap[currentToken]||0;
 $("actionLog").textContent=`Delegate ${qty} ${sym} → @${to}...`;
 broadcast(json, async function(r){ $("actionLog").innerHTML=`<span class="success">✓ DELEGATE BROADCAST OK</span>`; pollAfter(oldLiq, oldStake); }, function(e){ $("actionLog").textContent=`GAGAL DELEGATE: ${e.message}`; });
}
async function doUndelegate(){
 let sym=currentToken; let qty=parseFloat($("undelegateQty").value)||0;
 if(!(qty>0)){ $("actionLog").textContent="Jumlah invalid"; return; }
 let oldLiq=ownedMap[currentToken]||0; let oldStake=stakedMap[currentToken]||0;
 let json=JSON.stringify({contractName:"tokens",contractAction:"undelegate",contractPayload:{symbol:sym,quantity:fmt(qty)}});
 $("actionLog").textContent=`Undelegate ${qty} ${sym}...`;
 broadcast(json, async function(r){ $("actionLog").innerHTML=`<span class="success">✓ UNDELEGATE BROADCAST OK</span>`; pollAfter(oldLiq, oldStake); }, function(e){ $("actionLog").textContent=`GAGAL UNDELEGATE: ${e.message}`; });
}

function loginKC(){
 if(!isKC()) return;
 let username=$("user").value.trim().toLowerCase().replace(/\s+/g,""); if(username.length<3){let saved=localStorage.getItem(LS_USER); if(saved) username=saved; else{username=prompt("Username:"); if(!username) return; username=username.toLowerCase().replace(/\s+/g,"");}}
 $("kcBtn").disabled=true; $("kcBtn").textContent="MENUNGGU...";
 window.hive_keychain.requestSignBuffer(username, "login-"+Date.now(), "Posting", async function(res){
  $("kcBtn").disabled=false; $("kcBtn").textContent="🔑 LOGIN KEYCHAIN";
  if(res.success){account=username.toLowerCase(); useKeychain=true; activeKey=""; try{await loadNativeHive(); await loadBalances(); saveConnection(); showConnectedUI();}catch(e){$("info").textContent=e.message;}}else{$("kcStatus").textContent="GAGAL: "+res.message;}
 });
}
async function connectManual(){
 let u=($("userManual").value.trim()||$("user").value.trim()).toLowerCase().replace(/\s+/g,""); let k=$("key").value.trim();
 if(u.length<3){$("info").textContent="Username invalid"; return;} if(k.length<40){$("info").textContent="Harus Active Key"; return;}
 account=u; activeKey=k; useKeychain=false; $("loadBtn").disabled=true;
 try{await loadNativeHive(); await loadBalances(); saveConnection(); showConnectedUI();}catch(e){$("info").textContent=e.message;} finally{$("loadBtn").disabled=false;}
}
function doLogout(){clearConnection(); account=""; activeKey=""; useKeychain=false; ownedMap={}; $("user").value=""; $("userManual").value=""; $("key").value=""; showDisconnectedUI(); $("info").textContent="Logged out.";}
$("loadBtn").onclick=connectManual;
$("tokenSelect").onchange=async function(){currentToken=this.value; await loadTokenInfo(); loadPending(); };
window.addEventListener('load', async()=>{
  if(localStorage.getItem(LS_CONN) && localStorage.getItem(LS_USER)){
    account=localStorage.getItem(LS_USER); let savedMode=localStorage.getItem(LS_MODE); let savedAkey=localStorage.getItem(LS_AKEY);
    if(savedMode==="manual" && savedAkey){try{activeKey=atob(savedAkey); useKeychain=false;}catch(e){clearConnection(); checkKC(); return;}}else{useKeychain=true;}
    let wait=0; while(wait<15 && savedMode==="keychain" &&!isKC()){await new Promise(r=>setTimeout(r,200)); wait++;}
    try{await loadNativeHive(); await loadBalances(); showConnectedUI(); $("info").innerHTML=`<span class="success">● AUTO CONNECTED</span> @${account}`;}catch(e){$("info").textContent="Auto-connect gagal: "+e.message;}
  }else{checkKC();}
});
</script>
